name: OnyxOS CMake Xbox UWP Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uwp:
    name: CMake Configure and Build (UWP x64)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Verify CMake project
        shell: pwsh
        run: |
          if (-not (Test-Path './CMakeLists.txt')) {
            Write-Error 'CMakeLists.txt was not found in the repository root. Add the OnyxOS CMake project before building.'
            exit 1
          }

      - name: Configure Xbox UWP x64
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_SYSTEM_NAME=WindowsStore
          -DCMAKE_SYSTEM_VERSION=10.0
          -DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION=10.0.26100.0

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-CMake-UWP-x64
          path: |
            build/**/*.appx
            build/**/*.msix
            build/**/*.msixbundle
            build/**/*.appxbundle
            build/**/*.exe
            build/**/*.dll
          if-no-files-found: warn
          retention-days: 14
