name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onyxos:
    name: Build and sign seven OnyxOS entries into one APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and package OnyxOS
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Sign APPX (reuse PFX when configured, otherwise create one automatically)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ONYXOS_SIGNING_PFX_BASE64: ${{ secrets.ONYXOS_SIGNING_PFX_BASE64 }}
          ONYXOS_SIGNING_PFX_PASSWORD: ${{ secrets.ONYXOS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Join-Path $PWD 'artifacts/OnyxOS-x64.appx'
          if (-not (Test-Path $appx)) { throw "APPX package not found: $appx" }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/OnyxOS-signing.cer'

          if (-not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_PASSWORD)) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:ONYXOS_SIGNING_PFX_BASE64))
            $passwordText = $env:ONYXOS_SIGNING_PFX_PASSWORD
            $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $cert) { throw 'The configured PFX has no accessible private key.' }
            if ($cert.Subject -ne 'CN=Bluey683') { throw "Unexpected certificate subject: $($cert.Subject)" }
            Write-Host "Using configured PFX certificate: $($cert.Thumbprint)"
          }
          else {
            Write-Host 'No persistent PFX configured; generating a temporary development certificate for this build.'
            # Avoid New-SelfSignedCertificate here: it stalled for nearly an hour on the hosted runner.
            $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
            $keyPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing-key.pem'
            $pemPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing-cert.pem'
            $passwordText = [Guid]::NewGuid().ToString('N')

            & $openssl req -x509 -newkey rsa:2048 -sha256 -nodes -keyout $keyPath -out $pemPath -days 730 -subj '/CN=Bluey683' -addext 'keyUsage=digitalSignature' -addext 'extendedKeyUsage=codeSigning'
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL certificate generation failed (exit code $LASTEXITCODE)." }

            & $openssl pkcs12 -export -out $pfxPath -inkey $keyPath -in $pemPath -passout "pass:$passwordText"
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL PFX export failed (exit code $LASTEXITCODE)." }

            $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $cert) { throw 'The generated PFX has no accessible private key.' }
            Remove-Item $keyPath, $pemPath -Force
          }

          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -Path $sdkBin -Filter 'signtool.exe' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'SignTool.exe was not found in the installed Windows SDK.' }

          & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $passwordText /v $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed to sign the APPX (exit code $LASTEXITCODE)." }

          & $signTool.FullName verify /pa /v $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool could not verify the APPX (exit code $LASTEXITCODE)." }

          Remove-Item $pfxPath -Force
          Write-Host "Signed and verified APPX. Certificate thumbprint: $($cert.Thumbprint)"
          Write-Host "Public certificate: $cerPath"

      - name: Upload signed OnyxOS package and public certificate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64-Signed
          path: |
            artifacts/OnyxOS-x64.appx
            artifacts/OnyxOS-signing.cer
          if-no-files-found: error
          retention-days: 14
