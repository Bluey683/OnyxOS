name: VMware-UWP-Xbox - Portable Runtime

on:
  push:
    branches: [VMware-UWP-Xbox]
    paths:
      - ".github/workflows/build-uwp.yml"
      - "Package/**"
      - "src/**"
      - "OnyxOS.vcxproj"
  pull_request:
    branches: [VMware-UWP-Xbox]
  workflow_dispatch:
    inputs:
      portable_zip_url:
        description: "URL HTTPS direta do ZIP portátil autorizado do VMware"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vmware-uwp-xbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-portable-runtime:
    name: Baixar, extrair e preparar runtime portátil
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar diretórios temporários
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = Join-Path $env:RUNNER_TEMP 'VMware-UWP-Xbox'
          $zipDir = Join-Path $tempRoot 'download'
          $extractDir = Join-Path $tempRoot 'extracted'
          $stageDir = Join-Path $env:GITHUB_WORKSPACE 'Package/Runtime/VMware'
          New-Item -ItemType Directory -Force -Path $zipDir, $extractDir, $stageDir | Out-Null
          "VMWARE_TEMP_ROOT=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMWARE_ZIP_DIR=$zipDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMWARE_EXTRACT_DIR=$extractDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMWARE_STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Baixar ZIP portátil
        shell: pwsh
        env:
          INPUT_ZIP_URL: ${{ inputs.portable_zip_url }}
          REPO_ZIP_URL: ${{ vars.VMWARE_PORTABLE_ZIP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:INPUT_ZIP_URL
          if ([string]::IsNullOrWhiteSpace($url)) { $url = $env:REPO_ZIP_URL }

          $zipPath = Join-Path $env:VMWARE_ZIP_DIR 'VMware-Portable.zip'
          $repoZip = Join-Path $env:GITHUB_WORKSPACE 'VMware-Portable.zip'

          if (-not [string]::IsNullOrWhiteSpace($url)) {
            $uri = [Uri]$url
            if ($uri.Scheme -ne 'https') { throw 'A URL do ZIP precisa usar HTTPS.' }
            Invoke-WebRequest -Uri $uri -OutFile $zipPath
          } elseif (Test-Path $repoZip) {
            Copy-Item $repoZip $zipPath -Force
          } else {
            throw 'ZIP não fornecido. Informe portable_zip_url ao executar manualmente ou configure a variável de repositório VMWARE_PORTABLE_ZIP_URL.'
          }

          if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 1024) {
            throw 'VMware-Portable.zip está ausente ou parece inválido.'
          }
          "VMWARE_ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Extrair ZIP para pasta temporária
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath $env:VMWARE_ZIP_PATH -DestinationPath $env:VMWARE_EXTRACT_DIR -Force
          $files = @(Get-ChildItem -LiteralPath $env:VMWARE_EXTRACT_DIR -Recurse -File)
          if ($files.Count -eq 0) { throw 'O ZIP não contém arquivos.' }
          Write-Host "Arquivos extraídos: $($files.Count)"

      - name: Copiar runtime para a estrutura do pacote UWP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(Get-ChildItem -LiteralPath $env:VMWARE_EXTRACT_DIR -Force)
          if ($items.Count -eq 0) { throw 'A pasta temporária está vazia.' }
          Copy-Item -Path (Join-Path $env:VMWARE_EXTRACT_DIR '*') -Destination $env:VMWARE_STAGE_DIR -Recurse -Force

          $staged = @(Get-ChildItem -LiteralPath $env:VMWARE_STAGE_DIR -Recurse -File)
          if ($staged.Count -eq 0) { throw 'A cópia para Package/Runtime/VMware falhou.' }
          Write-Host "Runtime preparado: $($staged.Count) arquivos"
          Get-ChildItem -LiteralPath $env:VMWARE_STAGE_DIR -Force

      - name: Criar artefato do runtime preparado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $output = Join-Path $PWD 'artifacts/VMware-Portable-Staged.zip'
          if (Test-Path $output) { Remove-Item $output -Force }
          Compress-Archive -Path (Join-Path $env:VMWARE_STAGE_DIR '*') -DestinationPath $output -Force
          if ((Get-Item $output).Length -lt 1024) { throw 'O ZIP preparado está vazio ou incompleto.' }

      - name: Publicar runtime preparado
        uses: actions/upload-artifact@v4
        with:
          name: VMware-UWP-Xbox-Portable-Runtime
          path: artifacts/VMware-Portable-Staged.zip
          if-no-files-found: error
          retention-days: 14
