name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main, feature/windows11-corewindow]
  pull_request:
    branches: [main, feature/windows11-corewindow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onyxos-xbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-onyxos:
    name: Build and sign OnyxOS Windows 11 host (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out OnyxOS
        uses: actions/checkout@v4
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Validate pinned upstream QEMU-UWP-Host integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fetchScript = Get-Content 'scripts/Fetch-QemuRuntime.ps1' -Raw
          $buildScript = Get-Content 'Build.ps1' -Raw
          $pin = '53d6af6314f535c4c71c4be269777a710063327b'
          if ($fetchScript -notmatch [regex]::Escape($pin)) {
            throw "QEMU-UWP-Host is not pinned to the expected upstream commit: $pin"
          }
          if ($buildScript -notmatch 'Fetch-QemuRuntime\.ps1') {
            throw 'Build.ps1 does not invoke the upstream QEMU runtime fetch step.'
          }
          Write-Host "Verified QEMU-UWP-Host source pin: $pin"

      - name: Install qemu-img on the GitHub Actions runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install qemu -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey QEMU installation failed: $LASTEXITCODE" }
          # Chocolatey installs QEMU under Program Files, but the installer
          # does not reliably refresh the current Actions process PATH.
          $candidateDirs = @(
            (Join-Path $env:ProgramFiles 'qemu'),
            (Join-Path $env:ProgramFiles 'QEMU'),
            (Join-Path $env:ChocolateyInstall 'lib/qemu/tools')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          foreach ($dir in $candidateDirs) {
            $env:PATH = "$dir;$env:PATH"
            $env:GITHUB_PATH | Out-Null
            if ($env:GITHUB_PATH) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir }
          }
          $qemuImg = Get-Command qemu-img.exe -ErrorAction SilentlyContinue
          if (-not $qemuImg) {
            $qemuImgPath = Get-ChildItem -Path $candidateDirs -Filter 'qemu-img.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qemuImgPath) { $qemuImg = $qemuImgPath }
          }
          if (-not $qemuImg) { throw "QEMU was installed, but qemu-img.exe was not found. Searched: $($candidateDirs -join '; ')" }
          $qemuImgExecutable = if ($qemuImg.Source) { $qemuImg.Source } else { $qemuImg.FullName }
          & $qemuImgExecutable --version
          if ($LASTEXITCODE -ne 0) { throw 'qemu-img version check failed.' }
      - name: Create a fresh Windows 11 QCOW2 template
        shell: pwsh
        run: ./scripts/New-Qcow2Template.ps1 -RepositoryRoot $PWD -VirtualSize 64G

      - name: Build and package OnyxOS with Visual Studio MSBuild
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Sign APPX
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        shell: pwsh
        env:
          ONYXOS_SIGNING_PFX_BASE64: ${{ secrets.ONYXOS_SIGNING_PFX_BASE64 }}
          ONYXOS_SIGNING_PFX_PASSWORD: ${{ secrets.ONYXOS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Join-Path $PWD 'artifacts/OnyxOS-x64.appx'
          if (-not (Test-Path $appx)) { throw "APPX package not found: $appx" }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/OnyxOS-signing.cer'
          $persistentCertificate = -not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_PASSWORD)
          Write-Host 'SIGN 1/4: preparing certificate'
          if ($persistentCertificate) {
            [IO.File]::WriteAllBytes($pfxPath,[Convert]::FromBase64String($env:ONYXOS_SIGNING_PFX_BASE64))
            $passwordText=$env:ONYXOS_SIGNING_PFX_PASSWORD
            $cert=[System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath,$passwordText,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            if (-not $cert.HasPrivateKey) { throw 'Configured PFX has no private key.' }
            if ($cert.Subject -ne 'CN=Bluey683') { throw "Unexpected certificate subject: $($cert.Subject)" }
          } else {
            Write-Host 'No persistent PFX configured; creating a temporary development certificate.'
            $passwordText=[Guid]::NewGuid().ToString('N')
            $rsa=[System.Security.Cryptography.RSA]::Create(2048)
            $request=[System.Security.Cryptography.X509Certificates.CertificateRequest]::new('CN=Bluey683',$rsa,[System.Security.Cryptography.HashAlgorithmName]::SHA256,[System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new([System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,$false))
            $ekuOids=[System.Security.Cryptography.OidCollection]::new()
            [void]$ekuOids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids,$false))
            $generatedCert=$request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddMinutes(-5),[DateTimeOffset]::UtcNow.AddYears(2))
            [IO.File]::WriteAllBytes($pfxPath,$generatedCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,$passwordText))
            $cert=[System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath,$passwordText,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            $generatedCert.Dispose(); $rsa.Dispose()
            if (-not $cert.HasPrivateKey) { throw 'Generated certificate has no private key.' }
          }
          Write-Host 'SIGN 2/4: exporting public certificate'
          [IO.File]::WriteAllBytes($cerPath,$cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Write-Host 'SIGN 3/4: locating Windows SDK SignTool'
          $sdkBin=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signToolPath=Get-ChildItem -Path $sdkBin -Directory -ErrorAction Stop | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $signToolPath) { throw "SignTool.exe was not found under $sdkBin." }
          Write-Host 'SIGN 4/4: signing APPX'
          & $signToolPath sign /fd SHA256 /f $pfxPath /p $passwordText /v $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed: exit code $LASTEXITCODE" }
          if ($persistentCertificate) {
            & $signToolPath verify /pa /v $appx
            if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed: exit code $LASTEXITCODE" }
          } else { Write-Warning 'Temporary self-signed certificate: install artifacts/OnyxOS-signing.cer on the target Xbox before installing the APPX.' }
          Remove-Item $pfxPath -Force
          $cert.Dispose()
          Write-Host 'APPX signing step completed.'
      - name: Upload OnyxOS APPX and runtime dependency
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64-${{ github.event_name == 'pull_request' && 'Unsigned-PR' || 'Signed' }}
          path: |
            artifacts/OnyxOS-x64.appx
            artifacts/Microsoft.VCLibs.x64.14.00.appx
            artifacts/OnyxOS-signing.cer
          if-no-files-found: warn
          retention-days: 14
