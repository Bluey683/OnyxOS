name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onyxos:
    name: Build seven OnyxOS entries into one APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and package OnyxOS
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Upload single OnyxOS Xbox UWP package
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64
          path: artifacts/OnyxOS-x64.appx
          if-no-files-found: error
          retention-days: 14
