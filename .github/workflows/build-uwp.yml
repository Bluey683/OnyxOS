name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onyxos:
    name: Build and sign seven OnyxOS entries into one APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and package OnyxOS
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Import persistent signing certificate and sign APPX
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ONYXOS_SIGNING_PFX_BASE64: ${{ secrets.ONYXOS_SIGNING_PFX_BASE64 }}
          ONYXOS_SIGNING_PFX_PASSWORD: ${{ secrets.ONYXOS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Join-Path $PWD 'artifacts/OnyxOS-x64.appx'
          if (-not (Test-Path $appx)) {
            throw "APPX package not found: $appx"
          }
          if ([string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_PASSWORD)) {
            throw 'Configure repository Actions secrets ONYXOS_SIGNING_PFX_BASE64 and ONYXOS_SIGNING_PFX_PASSWORD with the existing persistent OnyxOS signing PFX.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/OnyxOS-signing.cer'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:ONYXOS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:ONYXOS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) {
            throw 'The supplied PFX does not contain an accessible private key.'
          }
          if ($cert.Subject -ne 'CN=Bluey683') {
            throw "Unexpected signing certificate subject: $($cert.Subject). Expected CN=Bluey683."
          }
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -Path $sdkBin -Filter 'signtool.exe' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw 'SignTool.exe was not found in the installed Windows SDK.'
          }

          & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $env:ONYXOS_SIGNING_PFX_PASSWORD /v $appx
          $signExitCode = $LASTEXITCODE
          if ($signExitCode -ne 0) {
            throw "SignTool failed to sign the APPX (exit code $signExitCode)."
          }

          & $signTool.FullName verify /pa /v $appx
          $verifyExitCode = $LASTEXITCODE
          if ($verifyExitCode -ne 0) {
            throw "SignTool could not verify the signed APPX (exit code $verifyExitCode)."
          }

          Remove-Item $pfxPath -Force
          Write-Host "Signed and verified APPX using persistent certificate: $($cert.Thumbprint)"
          Write-Host "Public certificate: $cerPath"

      - name: Upload signed OnyxOS package and public certificate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64-Signed
          path: |
            artifacts/OnyxOS-x64.appx
            artifacts/OnyxOS-signing.cer
          if-no-files-found: error
          retention-days: 14
