name: VMware-UWP-Xbox Build APPX

on:
  push:
    branches: [VMware-UWP-Xbox]
  pull_request:
    branches: [VMware-UWP-Xbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appx:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate package assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Make-Assets.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Asset generation script failed.' }
          if (!(Test-Path Assets/StoreLogo.png)) { throw 'StoreLogo asset not generated.' }

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere missing.' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild with C++ toolset not found.' }
          "MSBUILD_PATH=$msbuild" | Out-File $env:GITHUB_ENV -Append
          Write-Host $msbuild

      - name: Build unsigned APPX x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'artifacts/Appx'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:MSBUILD_PATH OnyxOS.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:AppxPackage=true /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never "/p:AppxPackageDir=$out/"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
          $packages = Get-ChildItem $out -Recurse -File -Include *.appx,*.msix | Where-Object { $_.Name -notmatch 'VCLibs|Dependencies' }
          if (!$packages) { throw 'No APPX/MSIX package found after build.' }
          $chosen = $packages | Sort-Object Length -Descending | Select-Object -First 1
          Copy-Item $chosen.FullName (Join-Path $PWD 'artifacts/OnyxOS-x64-unsigned.appx') -Force
          Write-Host "APPX produced: $($chosen.FullName)"

      - name: Validate APPX container and contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = 'artifacts/OnyxOS-x64-unsigned.appx'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $appx))
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('AppxManifest.xml','Shaders/onyxos.hlsl')) {
              if ($names -notcontains $required) { throw "Missing APPX entry: $required" }
            }
            Write-Host "APPX container validation passed; $($zip.Entries.Count) entries."
          } finally { $zip.Dispose() }

      - name: Upload APPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMware-UWP-Xbox-APPX-x64
          path: artifacts/OnyxOS-x64-unsigned.appx
          if-no-files-found: error
          retention-days: 14
