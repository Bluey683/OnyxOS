name: VMware-UWP-Xbox Build APPX

on:
  push:
    branches: [VMware-UWP-Xbox]
  pull_request:
    branches: [VMware-UWP-Xbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appx:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Generate package assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Make-Assets.ps1
          if (!(Test-Path Assets/StoreLogo.png)) { throw 'StoreLogo asset not generated.' }

      - name: Locate MSBuild with MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere missing.' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild with MSVC x64 toolset not found.' }
          "MSBUILD_PATH=$msbuild" | Out-File $env:GITHUB_ENV -Append
          Write-Host $msbuild

      - name: Build unsigned APPX x64 (${{ matrix.configuration }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = '${{ matrix.configuration }}'
          $out = Join-Path $PWD "artifacts/Appx/$configuration"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:MSBUILD_PATH OnyxOS.vcxproj /m /t:Rebuild /p:Configuration=$configuration /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:AppxPackage=true /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never "/p:AppxPackageDir=$out/"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
          $packages = Get-ChildItem $out -Recurse -File -Include *.appx,*.msix | Where-Object { $_.Name -notmatch 'VCLibs|Dependencies' }
          if (!$packages) { throw "No APPX/MSIX package found for $configuration." }
          $chosen = $packages | Sort-Object Length -Descending | Select-Object -First 1
          $destination = "artifacts/OnyxOS-x64-$configuration-unsigned.appx"
          Copy-Item $chosen.FullName $destination -Force
          if ($configuration -eq 'Debug') {
            $pdb = 'build/x64/Debug/OnyxOS.pdb'
            if (Test-Path $pdb) { Copy-Item $pdb 'artifacts/OnyxOS-x64-Debug.pdb' -Force }
            else { throw 'Debug PDB was not generated.' }
          }
          Write-Host "APPX produced: $destination"

      - name: Validate APPX container and contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = '${{ matrix.configuration }}'
          $appx = "artifacts/OnyxOS-x64-$configuration-unsigned.appx"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $appx))
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('AppxManifest.xml','Shaders/onyxos.hlsl')) {
              if ($names -notcontains $required) { throw "Missing APPX entry: $required" }
            }
            Write-Host "$configuration APPX validation passed; $($zip.Entries.Count) entries."
          } finally { $zip.Dispose() }

      - name: Create development certificate and sign APPX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bluey683' -FriendlyName 'OnyxOS Xbox Development' -CertStoreLocation 'Cert:\\CurrentUser\\My' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
          if (!$cert) { throw 'Failed to create OnyxOS development certificate.' }
          $passwordBytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($passwordBytes)
          $pfxPassword = [Convert]::ToBase64String($passwordBytes)
          $securePassword = ConvertTo-SecureString -String $pfxPassword -Force -AsPlainText
          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-Development.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath 'artifacts/OnyxOS-Development.cer' -Type CERT | Out-Null
          $signTool = Get-ChildItem "$env:ProgramFiles(x86)\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK SignTool not found.' }
          $appx = "artifacts/OnyxOS-x64-$configuration-unsigned.appx"
          & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPassword $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $LASTEXITCODE" }
          & $signTool.FullName verify /pa /v $appx
          if ($LASTEXITCODE -ne 0) { throw "APPX signature verification failed: $LASTEXITCODE" }
          Rename-Item $appx "OnyxOS-x64-$configuration.appx"
          Remove-Item $pfxPath -Force
          [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
          Remove-Item "Cert:\\CurrentUser\\My\\$($cert.Thumbprint)" -Force

      - name: Upload ${{ matrix.configuration }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMware-UWP-Xbox-${{ matrix.configuration }}-x64-Signed
          path: |
            artifacts/OnyxOS-x64-${{ matrix.configuration }}.appx
            artifacts/OnyxOS-x64-Debug.pdb
            artifacts/OnyxOS-Development.cer
          if-no-files-found: error
          retention-days: 14
