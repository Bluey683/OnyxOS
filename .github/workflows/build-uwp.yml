name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onyxos:
    name: Build and sign seven OnyxOS entries into one APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and package OnyxOS
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Sign APPX (fast, without certificate-store imports)
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        shell: pwsh
        env:
          ONYXOS_SIGNING_PFX_BASE64: ${{ secrets.ONYXOS_SIGNING_PFX_BASE64 }}
          ONYXOS_SIGNING_PFX_PASSWORD: ${{ secrets.ONYXOS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Join-Path $PWD 'artifacts/OnyxOS-x64.appx'
          if (-not (Test-Path $appx)) { throw "APPX package not found: $appx" }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/OnyxOS-signing.cer'
          Write-Host 'SIGN 1/5: preparing certificate'

          if (-not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:ONYXOS_SIGNING_PFX_PASSWORD)) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:ONYXOS_SIGNING_PFX_BASE64))
            $passwordText = $env:ONYXOS_SIGNING_PFX_PASSWORD
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $passwordText,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
            if (-not $cert.HasPrivateKey) { throw 'Configured PFX has no private key.' }
            if ($cert.Subject -ne 'CN=Bluey683') { throw "Unexpected certificate subject: $($cert.Subject)" }
            Write-Host "Using configured PFX certificate: $($cert.Thumbprint)"
          }
          else {
            Write-Host 'No persistent PFX configured; creating a temporary development certificate.'
            $passwordText = [Guid]::NewGuid().ToString('N')
            $rsa = [System.Security.Cryptography.RSA]::Create(2048)
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              'CN=Bluey683', $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $request.CertificateExtensions.Add(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
                [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature, $false
              )
            )
            $generatedCert = $request.CreateSelfSigned(
              [DateTimeOffset]::UtcNow.AddMinutes(-5),
              [DateTimeOffset]::UtcNow.AddYears(2)
            )
            $pfxBytes = $generatedCert.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
              $passwordText
            )
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath, $passwordText,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
            $generatedCert.Dispose()
            $rsa.Dispose()
            if (-not $cert.HasPrivateKey) { throw 'Generated certificate has no private key.' }
          }

          Write-Host 'SIGN 2/5: exporting public certificate'
          [IO.File]::WriteAllBytes(
            $cerPath,
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )

          Write-Host 'SIGN 3/5: locating Windows SDK SignTool'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signToolPath = Get-ChildItem -Path $sdkBin -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signToolPath) { throw "SignTool.exe was not found under $sdkBin." }

          Write-Host 'SIGN 4/5: signing APPX'
          & $signToolPath sign /fd SHA256 /f $pfxPath /p $passwordText /v $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed: exit code $LASTEXITCODE" }

          Write-Host 'SIGN 5/5: verifying signature'
          & $signToolPath verify /pa /v $appx
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed: exit code $LASTEXITCODE" }

          Remove-Item $pfxPath -Force
          $cert.Dispose()
          Write-Host 'APPX signed and signature verified.'
      - name: Upload signed OnyxOS package and public certificate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64-Signed
          path: |
            artifacts/OnyxOS-x64.appx
            artifacts/OnyxOS-signing.cer
          if-no-files-found: error
          retention-days: 14
