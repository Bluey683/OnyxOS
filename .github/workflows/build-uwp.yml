name: OnyxOS Xbox UWP Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-onyxos:
    name: Build and sign seven OnyxOS entries into one APPX (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build and package OnyxOS
        shell: pwsh
        run: ./Build.ps1 -Mode GitHubActions -Configuration Release -Architecture x64

      - name: Create development certificate and sign APPX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Join-Path $PWD 'artifacts/OnyxOS-x64.appx'
          if (-not (Test-Path $appx)) {
            throw "APPX package not found: $appx"
          }

          # Temporary development certificate. Only the public .cer is published.
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Bluey683' `
            -FriendlyName 'OnyxOS GitHub Actions Development Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(2) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          $passwordText = [Guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP 'OnyxOS-signing.pfx'
          $cerPath = Join-Path $PWD 'artifacts/OnyxOS-signing.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          # Trust the temporary signer on this disposable GitHub runner.
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -Path $sdkBin -Filter 'signtool.exe' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw 'SignTool.exe was not found in the installed Windows SDK.'
          }

          # Sign locally with SHA-256; no external timestamp server is contacted.
          & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $passwordText /v $appx
          $signExitCode = $LASTEXITCODE
          if ($signExitCode -ne 0) {
            throw "SignTool failed to sign the APPX (exit code $signExitCode)."
          }

          & $signTool.FullName verify /pa /v $appx
          $verifyExitCode = $LASTEXITCODE
          if ($verifyExitCode -ne 0) {
            throw "SignTool could not verify the signed APPX (exit code $verifyExitCode)."
          }

          Remove-Item $pfxPath -Force
          Write-Host "Signed and verified APPX: $appx"
          Write-Host "Public certificate: $cerPath"
          Write-Warning 'This is a self-signed development certificate. Trust OnyxOS-signing.cer on the Xbox before installing the APPX. A new certificate is generated for each workflow run.'

      - name: Upload signed OnyxOS package and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: OnyxOS-Xbox-UWP-x64-Signed
          path: |
            artifacts/OnyxOS-x64.appx
            artifacts/OnyxOS-signing.cer
          if-no-files-found: error
          retention-days: 14
