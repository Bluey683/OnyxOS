name: VMware-UWP-Xbox - Installer Runtime Staging

on:
  push:
    branches: [VMware-UWP-Xbox]
    paths:
      - ".github/workflows/build-uwp.yml"
      - "Package/**"
      - "src/**"
      - "OnyxOS.vcxproj"
  pull_request:
    branches: [VMware-UWP-Xbox]
  workflow_dispatch:
    inputs:
      installer_url:
        description: "URL HTTPS direta do instalador VMware Workstation 12.5.9 EXE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vmware-uwp-xbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-stage:
    name: Instalar VMware no runner e preparar arquivos candidatos
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar diretórios temporários
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'VMware-UWP-Xbox'
          $download = Join-Path $root 'download'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'Package/Runtime/VMware'
          New-Item -ItemType Directory -Force -Path $download, $stage | Out-Null
          "VMWARE_TEMP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMWARE_DOWNLOAD_DIR=$download" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMWARE_STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Baixar instalador VMware Workstation 12.5.9
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:INSTALLER_URL
          if ($uri.Scheme -ne 'https') { throw 'O instalador precisa ser baixado por HTTPS.' }
          $installer = Join-Path $env:VMWARE_DOWNLOAD_DIR 'VMware-workstation-full-12.5.9-7535481.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 10MB) {
            throw 'O instalador está ausente ou parece incompleto.'
          }
          "VMWARE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalar VMware silenciosamente no runner Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A instalação ocorre somente na máquina temporária do GitHub Actions.
          # Isso NÃO instala drivers no Xbox nem torna o Workstation compatível com UWP.
          $args = '/s /v"/qn EULAS_AGREED=1 REBOOT=ReallySuppress"'
          $p = Start-Process -FilePath $env:VMWARE_INSTALLER -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010, 1641)) {
            throw "Instalador VMware falhou. ExitCode=$($p.ExitCode)"
          }
          $candidates = @(
            (Join-Path $env:ProgramFiles 'VMware/VMware Workstation'),
            (Join-Path ${env:ProgramFiles(x86)} 'VMware/VMware Workstation')
          ) | Where-Object { $_ -and (Test-Path $_) }
          if ($candidates.Count -eq 0) {
            throw 'A instalação terminou, mas a pasta VMware Workstation não foi encontrada.'
          }
          "VMWARE_INSTALL_DIR=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Instalado em: $($candidates[0])"

      - name: Copiar arquivos de aplicação sem drivers para análise
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:VMWARE_INSTALL_DIR
          $dest = $env:VMWARE_STAGE_DIR

          # Não incluir drivers de kernel, serviços, instaladores ou componentes de rede.
          $excludedDirs = @('Drivers', 'NetworkDrivers', 'VMware VIX')
          $excludedFiles = @('*.sys', '*.inf', '*.cat', '*service*.exe', 'vmware-usbarbitrator*.exe')

          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            if ($_.PSIsContainer -and $excludedDirs -contains $_.Name) { return }
            if (-not $_.PSIsContainer -and ($excludedFiles | Where-Object { $_ -and $_ -like $_.Name })) { return }
            Copy-Item -LiteralPath $_.FullName -Destination $dest -Recurse -Force
          }

          $staged = @(Get-ChildItem -LiteralPath $dest -Recurse -File)
          if ($staged.Count -eq 0) { throw 'Nenhum arquivo de aplicação foi preparado.' }
          if (@(Get-ChildItem -LiteralPath $dest -Recurse -Include *.sys,*.inf,*.cat).Count -gt 0) {
            throw 'Foram encontrados drivers no staging; interrompendo para não empacotá-los.'
          }
          Write-Host "Arquivos candidatos preparados: $($staged.Count)"

      - name: Criar artefato para inspeção
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $output = Join-Path $PWD 'artifacts/VMware-Workstation-12.5.9-Files.zip'
          if (Test-Path $output) { Remove-Item $output -Force }
          Compress-Archive -Path (Join-Path $env:VMWARE_STAGE_DIR '*') -DestinationPath $output -Force
          if ((Get-Item $output).Length -lt 1MB) { throw 'O artefato preparado parece incompleto.' }

      - name: Publicar arquivos candidatos
        uses: actions/upload-artifact@v4
        with:
          name: VMware-UWP-Xbox-Workstation-12.5.9-Inspection
          path: artifacts/VMware-Workstation-12.5.9-Files.zip
          if-no-files-found: error
          retention-days: 14
